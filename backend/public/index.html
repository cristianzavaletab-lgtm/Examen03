<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ecommerce - Gestion de Productos</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <div class="container">
      <h1>Ecommerce Store</h1>
      <p>Sistema de gestion de productos</p>
    </div>
  </header>

  <main class="container">
    <!-- Formulario para crear/editar producto -->
    <section class="form-section">
      <h2 id="form-title">Agregar Producto</h2>
      <form id="product-form">
        <input type="hidden" id="product-id">
        <div class="form-group">
          <label for="name">Nombre del Producto</label>
          <input type="text" id="name" placeholder="Ej: Laptop Gaming" required>
        </div>
        <div class="form-group">
          <label for="description">Descripcion</label>
          <textarea id="description" placeholder="Descripcion del producto" rows="3" required></textarea>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="price">Precio (S/.)</label>
            <input type="number" id="price" placeholder="0.00" step="0.01" min="0.01" required>
          </div>
          <div class="form-group">
            <label for="stock">Stock</label>
            <input type="number" id="stock" placeholder="0" min="0" required>
          </div>
        </div>
        <div class="form-actions">
          <button type="submit" id="btn-submit" class="btn btn-primary">Crear Producto</button>
          <button type="button" id="btn-cancel" class="btn btn-secondary" style="display:none;">Cancelar</button>
        </div>
      </form>
    </section>

    <!-- Lista de productos -->
    <section class="products-section">
      <h2>Productos (<span id="product-count">0</span>)</h2>
      <div id="products-grid" class="products-grid">
        <p class="loading">Cargando productos...</p>
      </div>
    </section>
  </main>

  <!-- Modal de confirmacion -->
  <div id="modal" class="modal" style="display:none;">
    <div class="modal-content">
      <h3>Confirmar eliminacion</h3>
      <p>Esta seguro de que desea eliminar este producto?</p>
      <div class="modal-actions">
        <button id="btn-confirm-delete" class="btn btn-danger">Eliminar</button>
        <button id="btn-cancel-delete" class="btn btn-secondary">Cancelar</button>
      </div>
    </div>
  </div>

  <footer>
    <div class="container">
      <p>Ecommerce API - Cristian Zavaleta Burgos | Tecsup 2026</p>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
